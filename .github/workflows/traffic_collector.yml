name: "IsletArchive 24/365 Multi-Source Telemetry Collector"

on:
  schedule:
    # 3시간마다 정각 실행 (UTC 기준 0, 3, 6, 9, 12, 15, 18, 21시 / KST 기준 9, 12, 15, 18, 21, 0, 3, 6시)
    - cron: '0 */3 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 언제든 1-Click 수동 실행 가능

jobs:
  collect-telemetry:
    runs-on: ubuntu-latest
    steps:
      # [GEAR 9 0-Clone Observer Effect Elimination (2026-10-20)]
      # actions/checkout@v4 호출 시 발생하는 일 8회 자가 git clone 노이즈(H_0)를 원천 차단하기 위해
      # Git 프로토콜 대신 raw.githubusercontent.com 순수 HTTP GET으로 수집 스크립트만 인출합니다.
      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Fetch & Execute Traffic Collector (0-Clone HTTP Mode)"
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/architect-lee/genesis-icvm/main/islet_traffic_collector.py -o islet_traffic_collector.py
          python3 islet_traffic_collector.py
